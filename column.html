<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Flex 範例 6：垂直排列</title>
<style>
.container {
  display: flex;
  flex-direction: column; /* 改為垂直排列 */
  align-items: center;
  background-color: #fff3e0;
  height: 100vh;
}
.item {
  background-color: #ff5722;
  color: white;
  padding: 20px;
  margin: 10px;
  width: 200px;
  text-align: center;
  border-radius: 8px;
}
</style>
</head>
<body>
  <div class="container">
    <div class="item">上</div>
    <div class="item">中</div>
    <div class="item">下</div>
  </div>
</body>
</html>
