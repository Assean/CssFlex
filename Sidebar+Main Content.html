<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Flex 範例 5：側邊欄版型</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
}
.container {
  display: flex;
  height: 100vh;
}
.sidebar {
  width: 250px;
  background-color: #263238;
  color: white;
  padding: 20px;
}
.content {
  flex: 1; /* 主內容佔滿剩餘空間 */
  background-color: #eceff1;
  padding: 30px;
}
</style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>側邊欄</h2>
      <p>選單項目</p>
      <p>設定</p>
    </div>
    <div class="content">
      <h1>主內容區</h1>
      <p>這裡可以放文章、圖片或主要內容。</p>
    </div>
  </div>
</body>
</html>
