<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Flex 範例 4：平均分布</title>
<style>
.container {
  display: flex;
  justify-content: space-between; /* 平均分布間距 */
  background-color: #cfd8dc;
  padding: 20px;
}
.item {
  background-color: #673ab7;
  color: white;
  padding: 20px 40px;
  border-radius: 10px;
}
</style>
</head>
<body>
  <div class="container">
    <div class="item">左</div>
    <div class="item">中</div>
    <div class="item">右</div>
  </div>
</body>
</html>
