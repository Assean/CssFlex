<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Flex 範例 1：置中</title>
<style>
.container {
  display: flex; /* 啟用 Flex 排版 */
  justify-content: center; /* 水平置中 */
  align-items: center; /* 垂直置中 */
  height: 100vh; /* 視窗高度 */
  background-color: #f0f0f0;
}
.box {
  width: 200px;
  height: 200px;
  background-color: #4CAF50;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 20px;
}
</style>
</head>
<body>
  <div class="container">
    <div class="box">置中</div>
  </div>
</body>
</html>
