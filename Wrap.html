<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Flex 範例 3：自動換行</title>
<style>
.container {
  display: flex;
  flex-wrap: wrap; /* 允許自動換行 */
  background-color: #eee;
}
.item {
  background-color: #ff9800;
  color: white;
  width: 150px;
  height: 100px;
  margin: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>
</head>
<body>
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
  </div>
</body>
</html>
